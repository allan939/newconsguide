name: Update Website

on:
  # Rebuild the homepage whenever the market numbers in stats.json are edited
  push:
    branches: [main]
    paths: [stats.json]

  # Lets you click "Run" manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build page from latest data
        run: python3 build.py

      - name: Commit and deploy updated page
        run: |
          git config user.name "Auto Updater"
          git config user.email "action@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Rebuild homepage from updated market stats"
          git push
