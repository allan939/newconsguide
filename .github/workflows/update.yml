name: Update Website

on:
  # Runs on the 12th of every month at 9am CT (HAR posts data around the 10th)
  schedule:
    - cron: '0 14 12 * *'

  # Runs when deals.json is updated (stats.json excluded — manual edits must not
  # trigger the scraper or it will overwrite correct manually-set values)
  push:
    paths:
      - 'deals.json'

  # Lets you click "Run" manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      - name: Auto-fetch HAR market stats
        run: python3 scrape_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Auto-fetch builder deals (Claude + web search)
        run: python3 scrape_deals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build page from latest data
        run: python3 build.py

      - name: Commit and deploy updated page
        run: |
          git config user.name "Auto Updater"
          git config user.email "action@github.com"
          git add index.html stats.json deals.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date '+%B %Y') market stats and builder deals refreshed"
          git push
