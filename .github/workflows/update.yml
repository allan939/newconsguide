name: Update Website

on:
  # Runs on the 12th of every month at 9am CT (HAR posts data around the 10th)
  schedule:
    - cron: '0 14 12 * *'

  # Also runs when you manually edit deals.json or stats.json on GitHub
  push:
    paths:
      - 'deals.json'
      - 'stats.json'

  # Lets you click "Run" manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Auto-fetch HAR market stats
        run: python3 scrape_stats.py

      - name: Build page from latest data
        run: python3 build.py

      - name: Commit and deploy updated page
        run: |
          git config user.name "Auto Updater"
          git config user.email "action@github.com"
          git add index.html stats.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date '+%B %Y') market stats refreshed"
          git push
